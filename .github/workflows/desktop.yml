name: Desktop app and installers

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: Install native backend dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3 inotify-tools util-linux
      - run: python -m unittest discover -s tests -v
      - name: Browser and desktop integration (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
          xvfb-run -a npm run test:desktop
      - name: Build Linux installers
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Check installed Linux payload
        if: runner.os == 'Linux'
        run: |
          python scripts/check_installed_runtime.py dist/linux-unpacked/resources
          xvfb-run -a env PACKAGED_EXECUTABLE="$PWD/dist/linux-unpacked/googleunlimited" npm run test:desktop
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Install, verify runtime, and uninstall on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/GoogleUnlimited-Setup-*.exe | Where-Object Name -NotLike '*uninstaller*' | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'GoogleUnlimited-installed'
          $profile = Join-Path $env:APPDATA 'GoogleUnlimited'
          New-Item -ItemType Directory -Force $profile | Out-Null
          Set-Content (Join-Path $profile 'preserve-me.txt') 'retain app data'
          $setup = Start-Process -FilePath $installer -ArgumentList @('/S', '--no-desktop-shortcut', "/D=$target") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          if (-not (Test-Path (Join-Path $target 'GoogleUnlimited.exe'))) { throw 'App was not installed' }
          python scripts/check_installed_runtime.py (Join-Path $target 'resources')
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime failed' }
          New-Item 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Force | Out-Null
          New-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name GoogleUnlimited -Value 'test-entry' -Force | Out-Null
          Start-Process -FilePath (Join-Path $target 'Uninstall GoogleUnlimited.exe') -ArgumentList '/S' -Wait
          if (-not (Test-Path (Join-Path $profile 'preserve-me.txt'))) { throw 'Uninstaller removed user data' }
          if (Test-Path (Join-Path $target 'GoogleUnlimited.exe')) { throw 'Uninstaller left the app behind' }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name GoogleUnlimited -ErrorAction SilentlyContinue) { throw 'Uninstaller left the startup entry behind' }
      - run: python scripts/check_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: GoogleUnlimited-${{ runner.os }}-x64
          path: |
            dist/GoogleUnlimited-Setup-*.exe
            !dist/*uninstaller*
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS.txt
          if-no-files-found: error
